name: Bug report
description: Report a reproducible FolderForge defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Use SECURITY.md.
  - type: input
    id: version
    attributes: {label: FolderForge version, placeholder: "2.3.0 or commit SHA"}
    validations: {required: true}
  - type: input
    id: environment
    attributes: {label: Environment, placeholder: "Windows 11, Node 24, global npm install"}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior and redacted diagnostics}
    validations: {required: true}
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      options:
        - Data loss, security boundary, or secret exposure
        - Core workflow blocked with no workaround
        - Core workflow blocked with a workaround
        - Degraded UX, performance, or documentation
    validations: {required: true}
  - type: input
    id: last_known_good
    attributes: {label: Last known good version or commit, description: Leave "unknown" if not known.}
    validations: {required: true}
  - type: textarea
    id: minimal_reproduction
    attributes: {label: Minimal reproduction project or command, description: Do not include secrets or proprietary source.}
    validations: {required: true}
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, credentials, proprietary source, screenshots, and unredacted audit logs.
          required: true
