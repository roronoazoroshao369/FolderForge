name: production-soak

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or commit to soak
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-soak-${{ inputs.ref }}
  cancel-in-progress: false

env:
  SOAK_DURATION_MS: '86400000'
  SOAK_INTERVAL_MS: '1000'
  SOAK_FAULT_EVERY: '300'
  SOAK_OUTPUT_DIR: .folderforge-soak/runtime

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Resolve immutable commit
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          test "${#sha}" -eq 40
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"

  segment-1:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install and build exact source
        run: npm ci --ignore-scripts && npm run build && git diff --exit-code

      - name: Run first five-hour segment
        shell: bash
        run: |
          set +e
          timeout --preserve-status --signal=TERM --kill-after=30s 5h \
            node scripts/runtime-soak.mjs \
              --output-dir "${SOAK_OUTPUT_DIR}" \
              --duration-ms "${SOAK_DURATION_MS}" \
              --interval-ms "${SOAK_INTERVAL_MS}" \
              --fault-every "${SOAK_FAULT_EVERY}"
          code=$?
          set -e
          test "${code}" -eq 143
          node scripts/runtime-soak.mjs --output-dir "${SOAK_OUTPUT_DIR}" --verify

      - name: Preserve segment 1 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-soak-segment-1-${{ needs.prepare.outputs.commit }}
          path: ${{ env.SOAK_OUTPUT_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  segment-2:
    needs: [prepare, segment-1]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore segment 1 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-soak-segment-1-${{ needs.prepare.outputs.commit }}
          path: ${{ env.SOAK_OUTPUT_DIR }}

      - name: Install and build exact source
        run: npm ci --ignore-scripts && npm run build && git diff --exit-code

      - name: Run second five-hour segment
        shell: bash
        run: |
          set +e
          timeout --preserve-status --signal=TERM --kill-after=30s 5h \
            node scripts/runtime-soak.mjs \
              --output-dir "${SOAK_OUTPUT_DIR}" \
              --duration-ms "${SOAK_DURATION_MS}" \
              --interval-ms "${SOAK_INTERVAL_MS}" \
              --fault-every "${SOAK_FAULT_EVERY}" \
              --resume
          code=$?
          set -e
          test "${code}" -eq 143
          node scripts/runtime-soak.mjs --output-dir "${SOAK_OUTPUT_DIR}" --verify

      - name: Preserve segment 2 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-soak-segment-2-${{ needs.prepare.outputs.commit }}
          path: ${{ env.SOAK_OUTPUT_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  segment-3:
    needs: [prepare, segment-2]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore segment 2 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-soak-segment-2-${{ needs.prepare.outputs.commit }}
          path: ${{ env.SOAK_OUTPUT_DIR }}

      - name: Install and build exact source
        run: npm ci --ignore-scripts && npm run build && git diff --exit-code

      - name: Run third five-hour segment
        shell: bash
        run: |
          set +e
          timeout --preserve-status --signal=TERM --kill-after=30s 5h \
            node scripts/runtime-soak.mjs \
              --output-dir "${SOAK_OUTPUT_DIR}" \
              --duration-ms "${SOAK_DURATION_MS}" \
              --interval-ms "${SOAK_INTERVAL_MS}" \
              --fault-every "${SOAK_FAULT_EVERY}" \
              --resume
          code=$?
          set -e
          test "${code}" -eq 143
          node scripts/runtime-soak.mjs --output-dir "${SOAK_OUTPUT_DIR}" --verify

      - name: Preserve segment 3 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-soak-segment-3-${{ needs.prepare.outputs.commit }}
          path: ${{ env.SOAK_OUTPUT_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  segment-4:
    needs: [prepare, segment-3]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore segment 3 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-soak-segment-3-${{ needs.prepare.outputs.commit }}
          path: ${{ env.SOAK_OUTPUT_DIR }}

      - name: Install and build exact source
        run: npm ci --ignore-scripts && npm run build && git diff --exit-code

      - name: Run fourth five-hour segment
        shell: bash
        run: |
          set +e
          timeout --preserve-status --signal=TERM --kill-after=30s 5h \
            node scripts/runtime-soak.mjs \
              --output-dir "${SOAK_OUTPUT_DIR}" \
              --duration-ms "${SOAK_DURATION_MS}" \
              --interval-ms "${SOAK_INTERVAL_MS}" \
              --fault-every "${SOAK_FAULT_EVERY}" \
              --resume
          code=$?
          set -e
          test "${code}" -eq 143
          node scripts/runtime-soak.mjs --output-dir "${SOAK_OUTPUT_DIR}" --verify

      - name: Preserve segment 4 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-soak-segment-4-${{ needs.prepare.outputs.commit }}
          path: ${{ env.SOAK_OUTPUT_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  complete:
    needs: [prepare, segment-4]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Restore segment 4 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: production-soak-segment-4-${{ needs.prepare.outputs.commit }}
          path: ${{ env.SOAK_OUTPUT_DIR }}

      - name: Install and build exact source
        run: npm ci --ignore-scripts && npm run build && git diff --exit-code

      - name: Complete the 24-hour active soak
        shell: bash
        run: |
          set +e
          timeout --preserve-status --signal=TERM --kill-after=30s 5h \
            node scripts/runtime-soak.mjs \
              --output-dir "${SOAK_OUTPUT_DIR}" \
              --duration-ms "${SOAK_DURATION_MS}" \
              --interval-ms "${SOAK_INTERVAL_MS}" \
              --fault-every "${SOAK_FAULT_EVERY}" \
              --resume
          code=$?
          set -e
          test "${code}" -eq 0

      - name: Verify production evidence and bind it to the commit
        run: |
          node scripts/runtime-soak.mjs --output-dir "${SOAK_OUTPUT_DIR}" --verify
          node scripts/verify-production-soak.mjs \
            --evidence-dir "${SOAK_OUTPUT_DIR}" \
            --commit "${{ needs.prepare.outputs.commit }}" \
            --receipt "${SOAK_OUTPUT_DIR}/production-soak-receipt.json"

      - name: Preserve final production soak evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-soak-${{ needs.prepare.outputs.commit }}
          path: ${{ env.SOAK_OUTPUT_DIR }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
