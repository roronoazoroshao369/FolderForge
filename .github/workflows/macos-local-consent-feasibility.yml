name: macOS local-consent primitives feasibility (throwaway)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/feasibility-macos-local-consent.mjs'
      - '.github/workflows/macos-local-consent-feasibility.yml'
permissions:
  contents: read
jobs:
  os-primitives-only:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - name: Verify macOS owner-only files, symlink and noninteractive denial
        run: node scripts/feasibility-macos-local-consent.mjs
